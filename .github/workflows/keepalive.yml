name: Keepalive Workflow

on:
  schedule:
    - cron: "0 0 1 * *"    # 毎月1日に実行
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prevent GitHub Actions from disabling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows" > /dev/null
