name: Build AT-Fork

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild the current upstream version even if the fork release already exists"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 * * * *"

  push:
    paths:
      - ".github/workflows/repackage-archivetune.yml"
      - "icon-pack/icons/**"

permissions:
  contents: write

env:
  UPSTREAM_REPO: rukamori/ArchiveTune
  UPSTREAM_PACKAGE: moe.rukamori.archivetune
  FORK_PACKAGE: moe.rukamori.archivetune.fork
  FORK_NAME: AT-Fork
  ICON_DIR: icon-pack/icons

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest stable GMS mobile APK
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          latest="$(
            curl -fsSL \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=20" |
            jq -c 'map(select(.draft == false and .prerelease == false))[0]'
          )"

          test "$latest" != "null"
          test -n "$latest"

          tag="$(jq -r '.tag_name' <<< "$latest")"

          asset="$(
            jq -c '
              (.assets | map(select(.name == "app-gms-mobile-universal-release.apk")))[0]
              //
              (.assets | map(select(.name == "app-gms-mobile-arm64-release.apk")))[0]
              //
              (.assets | map(select(.name | test("^app-gms-mobile-.*\\.apk$"))))[0]
              //
              null
            ' <<< "$latest"
          )"

          test "$asset" != "null"
          test -n "$asset"

          apk_name="$(jq -r '.name' <<< "$asset")"
          apk_url="$(jq -r '.browser_download_url' <<< "$asset")"
          digest="$(jq -r '.digest // empty' <<< "$asset")"

          architecture="$(
            sed -n 's/^app-gms-mobile-\(.*\)-release\.apk$/\1/p' \
              <<< "$apk_name"
          )"

          test -n "$architecture"

          {
            echo "tag=$tag"
            echo "apk_name=$apk_name"
            echo "apk_url=$apk_url"
            echo "digest=$digest"
            echo "architecture=$architecture"
          } >> "$GITHUB_OUTPUT"

          echo "Upstream release: $tag"
          echo "Selected APK: $apk_name"
          echo "Architecture: $architecture"

      - name: Decide whether to build
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.upstream.outputs.tag }}"
          force="${{ github.event.inputs.force_rebuild || 'false' }}"

          if gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && [ "$force" != "true" ] \
            && [ "$GITHUB_EVENT_NAME" = "schedule" ]
          then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; scheduled build skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Building $tag."
          fi

      - name: Download upstream APK
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            -o original.apk \
            "${{ steps.upstream.outputs.apk_url }}"

          test -s original.apk

          expected="${{ steps.upstream.outputs.digest }}"

          if [ -n "$expected" ]; then
            actual="sha256:$(sha256sum original.apk | awk '{print $1}')"
            echo "Expected: $expected"
            echo "Actual:   $actual"
            test "$expected" = "$actual"
          fi

      - name: Set up Java 17
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.guard.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android build tools and Apktool
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "build-tools;35.0.0"

          apktool_url="$(
            curl -fsSL \
              https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -r '[
              .assets[]
              | select(.name | test("^apktool_.*\\.jar$"; "i"))
            ][0].browser_download_url'
          )"

          test "$apktool_url" != "null"
          test -n "$apktool_url"

          curl -fsSL -o apktool.jar "$apktool_url"
          java -jar apktool.jar --version

      - name: Verify upstream APK package
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          package="$(
            "$bt/aapt" dump badging original.apk |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          echo "Detected: $package"
          echo "Expected: $UPSTREAM_PACKAGE"
          test "$package" = "$UPSTREAM_PACKAGE"

      - name: Decompile APK
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          java -jar apktool.jar d original.apk \
            --output decoded \
            --force

      - name: Patch package identity and built-in Community Icons
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          manifest="decoded/AndroidManifest.xml"
          catalog="decoded/assets/icon_pack/catalog.json"

          test -f "$manifest"
          test -f "$catalog"

          old_escaped="${UPSTREAM_PACKAGE//./\\.}"

          sed -i \
            "s/package=\"${UPSTREAM_PACKAGE}\"/package=\"${FORK_PACKAGE}\"/" \
            "$manifest"

          sed -i \
            "/android:authorities=/ s/${old_escaped}\./${FORK_PACKAGE}./g; \
             /<permission\b/ s/${old_escaped}\./${FORK_PACKAGE}./g; \
             /<uses-permission\b/ s/${old_escaped}\./${FORK_PACKAGE}./g; \
             /android:permission=/ s/${old_escaped}\./${FORK_PACKAGE}./g" \
            "$manifest"

          sed -i \
            "s/${old_escaped}\.launcher\./${FORK_PACKAGE}.launcher./g" \
            "$manifest"

          python3 - "$catalog" "$UPSTREAM_PACKAGE" "$FORK_PACKAGE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]

          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("catalog.json must be a JSON array")

          changed = 0

          for entry in data:
              if not isinstance(entry, dict):
                  raise SystemExit("catalog.json contains a non-object entry")

              alias = entry.get("aliasClassName")

              if isinstance(alias, str) and alias.startswith(old + ".launcher."):
                  entry["aliasClassName"] = new + alias[len(old):]
                  changed += 1

          if changed == 0:
              raise SystemExit("No upstream Community Icon aliases were patched")

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
          )

          print(f"Patched {changed} built-in Community Icon aliases.")
          PY

          while IFS= read -r -d '' file; do
            if grep -q '<string name="app_name">' "$file"; then
              sed -i \
                "s#<string name=\"app_name\">[^<]*</string>#<string name=\"app_name\">${FORK_NAME}</string>#" \
                "$file"
            fi
          done < <(find decoded/res -type f -name strings.xml -print0)

          grep -q "package=\"${FORK_PACKAGE}\"" "$manifest"

          if grep -Rq "${UPSTREAM_PACKAGE}\.launcher\." "$manifest"; then
            echo "::error::Upstream launcher alias namespace remains in AndroidManifest.xml"
            exit 1
          fi

          if grep -q \
            "\"aliasClassName\".*\"${UPSTREAM_PACKAGE}\\.launcher\\." \
            "$catalog"
          then
            echo "::error::Upstream launcher alias namespace remains in catalog.json"
            exit 1
          fi

      - name: Patch updater to this repository
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          fork_owner="${GITHUB_REPOSITORY%%/*}"
          fork_repo="${GITHUB_REPOSITORY##*/}"

          echo "Updater repository: ${fork_owner}/${fork_repo}"

          while IFS= read -r -d '' file; do
            if grep -qE \
              'GITHUB_OWNER|GITHUB_REPO|RELEASE_GITHUB_OWNER|RELEASE_GITHUB_REPO' \
              "$file"
            then
              sed -i \
                -e "s/\"rukamori\"/\"${fork_owner}\"/g" \
                -e "s/\"ArchiveTune\"/\"${fork_repo}\"/g" \
                "$file"

              echo "Patched BuildConfig repository constants: $file"
            fi
          done < <(
            find decoded/smali* \
              -type f \
              -name '*.smali' \
              -print0 2>/dev/null || true
          )

          while IFS= read -r -d '' file; do
            if [[ "$file" == *"/Updater.smali" ]]; then
              sed -i \
                -e "s#https://api\\.github\\.com/repos/rukamori/ArchiveTune/commits#https://api.github.com/repos/${fork_owner}/${fork_repo}/commits#g" \
                -e "s#https://github\\.com/rukamori/ArchiveTune/releases#https://github.com/${fork_owner}/${fork_repo}/releases#g" \
                -e "s#https://nightly\\.link/rukamori/ArchiveTune/#https://nightly.link/${fork_owner}/${fork_repo}/#g" \
                -e "s/\"rukamori\"/\"${fork_owner}\"/g" \
                -e "s/\"ArchiveTune\"/\"${fork_repo}\"/g" \
                "$file"

              echo "Patched Updater.smali: $file"
            fi
          done < <(
            find decoded/smali* \
              -type f \
              -name '*.smali' \
              -print0 2>/dev/null || true
          )

          if grep -Rqs \
            -e 'https://api.github.com/repos/rukamori/ArchiveTune/commits' \
            -e 'https://github.com/rukamori/ArchiveTune/releases' \
            -e 'https://nightly.link/rukamori/ArchiveTune/' \
            decoded/smali* 2>/dev/null
          then
            echo "::error::An upstream updater URL remains in smali."
            exit 1
          fi

          echo "Updater patch PASSED."

      - name: Add GitHub-hosted selectable Community Icons
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' icon_files < <(
            find "$ICON_DIR" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.png' -o \
                -iname '*.jpg' -o \
                -iname '*.jpeg' -o \
                -iname '*.webp' \
              \) \
              -print0 \
              2>/dev/null || true
          )

          if [ "${#icon_files[@]}" -eq 0 ]; then
            echo "No GitHub-hosted selectable icons found."
            exit 0
          fi

          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            pillow

          python3 \
            "${FORK_PACKAGE}" \
            "${GITHUB_REPOSITORY}" \
            "decoded/AndroidManifest.xml" \
            "decoded/assets/icon_pack/catalog.json" \
            "${icon_files[@]}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          from PIL import Image, ImageOps

          package_name = sys.argv[1]
          repository = sys.argv[2]
          manifest_path = Path(sys.argv[3])
          catalog_path = Path(sys.argv[4])
          files = [Path(x) for x in sys.argv[5:]]

          ANDROID = "{http://schemas.android.com/apk/res/android}"

          catalog = json.loads(
              catalog_path.read_text(encoding="utf-8")
          )

          if not isinstance(catalog, list):
              raise SystemExit("catalog.json is not a JSON array")

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          application = root.find("application")

          if application is None:
              raise SystemExit(
                  "AndroidManifest.xml has no <application>"
              )

          target_activity = None

          for activity in application.findall("activity"):
              has_main = False
              has_launcher = False

              for intent_filter in activity.findall("intent-filter"):
                  for action in intent_filter.findall("action"):
                      if action.get(ANDROID + "name") == \
                              "android.intent.action.MAIN":
                          has_main = True

                  for category in intent_filter.findall("category"):
                      if category.get(ANDROID + "name") == \
                              "android.intent.category.LAUNCHER":
                          has_launcher = True

              if has_main and has_launcher:
                  target_activity = activity.get(ANDROID + "name")
                  break

          if not target_activity:
              raise SystemExit(
                  "Could not find the existing MAIN/LAUNCHER activity"
              )

          print(f"Icon target activity: {target_activity}")

          existing_ids = {
              entry.get("id")
              for entry in catalog
              if isinstance(entry, dict)
          }

          existing_aliases = {
              entry.get("aliasClassName")
              for entry in catalog
              if isinstance(entry, dict)
          }

          values_dir = Path("decoded/res/values")
          drawable_dir = Path("decoded/res/drawable-nodpi")
          mipmap_dir = Path("decoded/res/mipmap-anydpi-v26")

          values_dir.mkdir(parents=True, exist_ok=True)
          drawable_dir.mkdir(parents=True, exist_ok=True)
          mipmap_dir.mkdir(parents=True, exist_ok=True)

          new_alias_xml = []

          for source in sorted(files, key=lambda x: x.name.lower()):
              raw = source.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()[:16]

              icon_id = "github_" + digest
              drawable = "icon_pack_github_" + digest
              alias = package_name + ".launcher.GitHubIconAlias" + digest

              if icon_id in existing_ids:
                  raise SystemExit(
                      f"{source.name}: duplicate icon id {icon_id}"
                  )

              if alias in existing_aliases:
                  raise SystemExit(
                      f"{source.name}: duplicate activity-alias {alias}"
                  )

              image = Image.open(source).convert("RGBA")

              if image.width != image.height:
                  raise SystemExit(
                      f"{source.name}: image must be square "
                      f"(got {image.width}x{image.height})"
                  )

              canvas = Image.new(
                  "RGBA",
                  (1024, 1024),
                  (0, 0, 0, 0),
              )

              fitted = ImageOps.contain(
                  image,
                  (1024, 1024),
                  Image.Resampling.LANCZOS,
              )

              canvas.alpha_composite(
                  fitted,
                  (
                      (1024 - fitted.width) // 2,
                      (1024 - fitted.height) // 2,
                  ),
              )

              canvas.save(
                  drawable_dir / f"{drawable}.png",
                  format="PNG",
                  optimize=True,
              )

              # Background color for the adaptive-icon wrapper.
              sample = canvas.resize(
                  (64, 64),
                  Image.Resampling.BILINEAR,
              )

              opaque = [
                  pixel[:3]
                  for pixel in sample.getdata()
                  if pixel[3] > 8
              ]

              if opaque:
                  rgb = tuple(
                      sum(pixel[index] for pixel in opaque)
                      // len(opaque)
                      for index in range(3)
                  )
              else:
                  rgb = (24, 24, 24)

              background = "#{:02X}{:02X}{:02X}".format(*rgb)

              (values_dir / f"{drawable}_colors.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  "<resources>\n"
                  f'    <color name="{drawable}_background">'
                  f"{background}"
                  "</color>\n"
                  "</resources>\n",
                  encoding="utf-8",
              )

              adaptive_xml = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon '
                  'xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  f'    <background android:drawable="@color/{drawable}_background" />\n'
                  f'    <foreground android:drawable="@drawable/{drawable}" />\n'
                  "</adaptive-icon>\n"
              )

              (mipmap_dir / f"{drawable}.xml").write_text(
                  adaptive_xml,
                  encoding="utf-8",
              )

              (mipmap_dir / f"{drawable}_round.xml").write_text(
                  adaptive_xml,
                  encoding="utf-8",
              )

              catalog.append(
                  {
                      "id": icon_id,
                      "name": source.stem,
                      "author": "AT-Fork GitHub",
                      "link": "",
                      "githubAuthorUrl": (
                          "https://github.com/" + repository
                      ),
                      "source": source.name,
                      "drawableResourceName": drawable,
                      "aliasClassName": alias,
                  }
              )

              new_alias_xml.append(
                  "\n".join(
                      [
                          "        <activity-alias",
                          f'            android:name="{alias}"',
                          '            android:enabled="false"',
                          '            android:exported="true"',
                          f'            android:icon="@mipmap/{drawable}"',
                          '            android:label="@string/app_name"',
                          f'            android:roundIcon="@mipmap/{drawable}_round"',
                          f'            android:targetActivity="{target_activity}">',
                          "            <intent-filter>",
                          '                <action android:name="android.intent.action.MAIN" />',
                          '                <category android:name="android.intent.category.LAUNCHER" />',
                          '                <category android:name="android.intent.category.APP_MUSIC" />',
                          '                <category android:name="android.intent.category.DEFAULT" />',
                          "            </intent-filter>",
                          "        </activity-alias>",
                      ]
                  )
              )

              existing_ids.add(icon_id)
              existing_aliases.add(alias)

          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
          )

          manifest_text = manifest_path.read_text(encoding="utf-8")
          marker = "</application>"

          if marker not in manifest_text:
              raise SystemExit(
                  "AndroidManifest.xml has no </application>"
              )

          block = "\n" + "\n".join(new_alias_xml) + "\n"

          manifest_path.write_text(
              manifest_text.replace(marker, block + marker, 1),
              encoding="utf-8",
          )

          print(
              f"Embedded {len(files)} GitHub-hosted selectable Community Icons."
          )
          PY

      # ============================================================
      # IMPORTANT:
      # Do NOT replace branding/icon.png.
      #
      # The upstream launcher icon remains the default icon.
      # K.png (or any other user image) belongs in ICON_DIR and is
      # therefore treated as a Community Icon.
      # ============================================================

      - name: Rebuild APK
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          java -jar apktool.jar b decoded \
            --output unsigned.apk

          test -s unsigned.apk

      - name: Verify rebuilt APK
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "=== BASIC IDENTITY CHECK ==="

          package="$(
            "$bt/aapt" dump badging unsigned.apk |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p"
          )"

          label="$(
            "$bt/aapt" dump badging unsigned.apk |
            sed -n "s/.*application-label:'\([^']*\)'.*/\1/p"
          )"

          echo "Expected package: $FORK_PACKAGE"
          echo "Actual package:   $package"
          echo
          echo "Expected label:   $FORK_NAME"
          echo "Actual label:     $label"

          test "$package" = "$FORK_PACKAGE"
          test "$label" = "$FORK_NAME"

          echo
          echo "=== COMMUNITY ICON CATALOG ==="

          unzip -p \
            unsigned.apk \
            assets/icon_pack/catalog.json \
            > final-catalog.json

          test -s final-catalog.json

          python3 - "$FORK_PACKAGE" "$UPSTREAM_PACKAGE" <<'PY'
          import json
          import sys
          from pathlib import Path

          fork = sys.argv[1]
          upstream = sys.argv[2]

          data = json.loads(
              Path("final-catalog.json")
              .read_text(encoding="utf-8")
          )

          fork_aliases = []
          upstream_aliases = []

          for entry in data:
              if not isinstance(entry, dict):
                  continue

              alias = entry.get("aliasClassName")

              if not isinstance(alias, str):
                  continue

              if alias.startswith(fork + ".launcher."):
                  fork_aliases.append(alias)

              if alias.startswith(upstream + ".launcher."):
                  upstream_aliases.append(alias)

          print(f"Catalog entries: {len(data)}")
          print(f"Fork aliases:    {len(fork_aliases)}")
          print(f"Upstream aliases:{len(upstream_aliases)}")

          if not fork_aliases:
              raise SystemExit(
                  "ERROR: catalog.json contains no fork Community Icon aliases"
              )

          if upstream_aliases:
              raise SystemExit(
                  "ERROR: upstream Community Icon aliases remain"
              )

          print("Community Icon catalog verification PASSED.")
          PY

          echo
          echo "=== MANIFEST ALIAS CHECK ==="

          python3 - "$FORK_PACKAGE" "$UPSTREAM_PACKAGE" <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          fork = sys.argv[1]
          upstream = sys.argv[2]
          android = "{http://schemas.android.com/apk/res/android}"

          root = ET.parse(
              Path("decoded/AndroidManifest.xml")
          ).getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit("ERROR: no <application>")

          fork_aliases = []
          upstream_aliases = []

          for element in application:
              if element.tag != "activity-alias":
                  continue

              name = element.get(android + "name", "")

              if name.startswith(fork + ".launcher."):
                  fork_aliases.append(name)

              if name.startswith(upstream + ".launcher."):
                  upstream_aliases.append(name)

          print(f"Fork launcher aliases:     {len(fork_aliases)}")
          print(f"Upstream launcher aliases: {len(upstream_aliases)}")

          if not fork_aliases:
              raise SystemExit("ERROR: no fork launcher aliases")

          if upstream_aliases:
              raise SystemExit(
                  "ERROR: upstream launcher aliases remain"
              )

          print("Manifest launcher alias verification PASSED.")
          PY

          echo
          echo "=== GITHUB ICON RESOURCE CHECK ==="

          python3 <<'PY'
          import json
          from pathlib import Path
          import zipfile

          catalog = json.loads(
              Path("final-catalog.json")
              .read_text(encoding="utf-8")
          )

          entries = [
              entry
              for entry in catalog
              if isinstance(entry, dict)
              and str(entry.get("id", "")).startswith("github_")
          ]

          print(f"GitHub-hosted icon entries: {len(entries)}")

          with zipfile.ZipFile("unsigned.apk") as apk:
              names = set(apk.namelist())

              for entry in entries:
                  drawable = entry.get("drawableResourceName")

                  if not drawable:
                      raise SystemExit(
                          "ERROR: GitHub icon entry has no drawableResourceName"
                      )

                  drawable_path = (
                      f"res/drawable-nodpi/{drawable}.png"
                  )

                  adaptive_path = (
                      f"res/mipmap-anydpi-v26/{drawable}.xml"
                  )

                  round_path = (
                      f"res/mipmap-anydpi-v26/{drawable}_round.xml"
                  )

                  if drawable_path not in names:
                      raise SystemExit(
                          f"ERROR: missing {drawable_path}"
                      )

                  if adaptive_path not in names:
                      raise SystemExit(
                          f"ERROR: missing {adaptive_path}"
                      )

                  if round_path not in names:
                      raise SystemExit(
                          f"ERROR: missing {round_path}"
                      )

          print("GitHub icon resource verification PASSED.")
          PY

          echo
          echo "=== FULL REBUILD VERIFICATION PASSED ==="

      - name: Load signing key
        id: signing
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          test -n "${{ secrets.KEYSTORE_PASSWORD }}"

          printf '%s' \
            "${{ secrets.KEYSTORE_BASE64 }}" |
            base64 --decode > release.jks

          test -s release.jks

          key_alias="$(
            keytool -list \
              -keystore release.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" |
            awk -F, '
              /PrivateKeyEntry/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                print $1
                exit
              }
            '
          )"

          test -n "$key_alias"
          echo "key_alias=$key_alias" >> "$GITHUB_OUTPUT"

      - name: Zipalign
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          "$bt/zipalign" \
            -p -f 4 \
            unsigned.apk \
            aligned.apk

      - name: Sign APK
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          output="ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk"

          key_password="${{ secrets.KEY_PASSWORD }}"

          if [ -n "$key_password" ]; then
            "$bt/apksigner" sign \
              --ks release.jks \
              --ks-key-alias "${{ steps.signing.outputs.key_alias }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${key_password}" \
              --out "$output" \
              aligned.apk
          else
            "$bt/apksigner" sign \
              --ks release.jks \
              --ks-key-alias "${{ steps.signing.outputs.key_alias }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --out "$output" \
              aligned.apk
          fi

          "$bt/apksigner" verify --verbose "$output"

      - name: Create updater-compatible APK asset
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk" \
            "app-gms-mobile-${{ steps.upstream.outputs.architecture }}-release.apk"

      - name: Publish GitHub Release
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.upstream.outputs.tag }}"

          gh release delete "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag \
            >/dev/null 2>&1 || true

          gh release create "$tag" \
            "ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk" \
            "app-gms-mobile-${{ steps.upstream.outputs.architecture }}-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AT-Fork ${{ steps.upstream.outputs.tag }}" \
            --notes "
Repackaged from upstream ArchiveTune.

Upstream:
https://github.com/rukamori/ArchiveTune

Fork package:
${FORK_PACKAGE}

The default launcher icon remains the upstream ArchiveTune icon.

Community icons uploaded to:
${ICON_DIR}/

are embedded into the APK and can be selected from ArchiveTune's
built-in app icon picker.

The release tag intentionally matches the upstream version so the
in-app updater can compare semantic versions correctly.
"

      - name: Write SHA256
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "ArchiveTuneFork-${{ steps.upstream.outputs.tag }}.apk" \
            "app-gms-mobile-${{ steps.upstream.outputs.architecture }}-release.apk"
